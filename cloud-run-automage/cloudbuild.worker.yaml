steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - storage
      - cp
      - '${_SAM3_WEIGHTS_GCS_URI}/model-00001-of-00002.safetensors'
      - 'vendor/automage/automage/models/sam3/model-00001-of-00002.safetensors'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - storage
      - cp
      - '${_SAM3_WEIGHTS_GCS_URI}/model-00002-of-00002.safetensors'
      - 'vendor/automage/automage/models/sam3/model-00002-of-00002.safetensors'
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'cloud-run-automage/Dockerfile.worker', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=python
      - '${_IMAGE}'
      - -c
      - "import torch; from automage.config import Config, model_sha; from transformers import Sam3Processor; assert torch.version.cuda; model_sha(Config.model); Sam3Processor.from_pretrained(Config.model, local_files_only=True)"
images: ['${_IMAGE}']
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
